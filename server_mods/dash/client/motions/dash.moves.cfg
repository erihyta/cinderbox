cinderbox_motions	2
# Baked from the CbMotion nodes of a CbMotionSet. Edit the scene and bake again.
motion	Dash
when	press	dash
if	( dash.charges > 0 )
cooldown	0.4
duration	0.18
param	friction	0
impulse	self	11	move	horizontal
change	dash.charges	-=	1
emit	dash.started
motion	DoubleJump
when	press	jump
if	( not grounded ) and ( dash.double_jump_on )
uses	1	ground
impulse	self	6.5	up	vertical
emit	dash.double_jump
