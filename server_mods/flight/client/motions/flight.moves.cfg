cinderbox_motions	1
# Baked from the CbMotion nodes of a CbMotionSet. Edit the scene and bake again.
motion	FlyOn
when	press	fly
if	( not flight.on )
change	flight.on	=	1
emit	flight.started
motion	FlyOff
when	press	fly
if	( flight.on )
change	flight.on	=	0
emit	flight.stopped
motion	Flying
when	while
if	( flight.on )
param	walk_speed	7
param	sprint_speed	12
param	air_control	1
param	gravity	0
param	air_friction	3
param	move_frame	1
motion	Thrust
when	while
if	( flight.jetpack_on ) and ( held.jump ) and ( not grounded ) and ( not flight.on ) and ( flight.fuel > 0 )
impulse	26	up	none
change	flight.fuel	-=	30
emit	flight.thrust
motion	Refuel
when	while
if	( flight.jetpack_on ) and ( grounded ) and ( flight.fuel < 100 )
change	flight.fuel	+=	40
motion	Glide
when	while
if	( held.sprint ) and ( not grounded ) and ( vertical_speed < 0 ) and ( not flight.on )
param	air_control	0.8
param	gravity	3
param	max_fall	2.5
