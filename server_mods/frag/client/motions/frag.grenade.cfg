cinderbox_motions	3
# Baked from the CbMotion nodes of the CbItem frag.grenade. Edit the item's scene and bake again.
motion	Throwing
when	event	frag.grenade.used
cooldown	0.7
duration	0.7
motion	Release
when	event	frag.release
if	( carried.frag.grenade )
emit	frag.thrown
launch_carried	frag.grenade	15	look	3	0.8	2.5
motion	Blast
when	event	frag.grenade.expired
owner	item
emit	frag.blast
break	frag.break_radius	frag.push	frag.rubble_seconds
find	bodies	0	16	facing
shape	8	0	0	0
impulse	found	(distance < frag.radius) * frag.push * (1 - distance / frag.radius)	away	none
impulse	found	(distance < frag.radius) * 0.35 * frag.push * (1 - distance / frag.radius)	up	none
endfind
