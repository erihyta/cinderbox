cinderbox_motions	3
# Baked from the CbMotion nodes of the CbItem gun.pistol. Edit the item's scene and bake again.
motion	Fire
item	gun.pistol	hand
when	event	gun.pistol.used
if	( item:gun.rounds > 0 and not item:gun.reloading )
cooldown	0.2
change	item:gun.rounds	-=	1
emit	item.use
motion	Dry
item	gun.pistol	hand
when	event	gun.pistol.used
if	( item:gun.rounds <= 0 and not item:gun.reloading )
cooldown	0.2
change	item:gun.reloading	=	1
change	item:gun.reload_left	=	1.5
emit	item.use_failed
emit	item.reload
motion	Reload
item	gun.pistol	hand
when	press	reload
if	( gun.pistol ) and ( not item:gun.reloading and item:gun.rounds < item:gun.magazine )
change	item:gun.reloading	=	1
change	item:gun.reload_left	=	1.5
emit	item.reload
motion	Reloaded
item	gun.pistol	carried
when	edge	item:gun.reloading and item:gun.reload_left <= 0
if	( carried.gun.pistol )
change	item:gun.reloading	=	0
change	item:gun.rounds	=	item:gun.magazine
