cinderbox_motions	3
# Baked from the CbMotion nodes of the CbItem gun.pistol. Edit the item's scene and bake again.
motion	Fire
when	event	gun.pistol.used
if	( gun.ammo > 0 and not gun.reloading )
cooldown	0.2
change	gun.ammo	-=	1
emit	item.use
motion	Dry
when	event	gun.pistol.used
if	( gun.ammo <= 0 and not gun.reloading )
cooldown	0.2
change	gun.reloading	=	1
emit	item.use_failed
emit	item.reload
motion	Reload
when	press	reload
if	( gun.pistol ) and ( not gun.reloading and gun.ammo < gun.magazine )
change	gun.reloading	=	1
emit	item.reload
