cinderbox_motions	2
# Baked from the CbMotion nodes of a CbMotionSet. Edit the scene and bake again.
motion	ComboFade
when	while
if	( brawl.combo_left > 0 )
change	brawl.combo_left	-=	1
motion	ComboReset
when	while
if	( brawl.combo_left <= 0 ) and ( brawl.combo > 0 )
change	brawl.combo	=	0
motion	CoolDash
when	while
if	( brawl.cd_dash > 0 )
change	brawl.cd_dash	-=	1
motion	CoolUpper
when	while
if	( brawl.cd_upper > 0 )
change	brawl.cd_upper	-=	1
motion	CoolSlam
when	while
if	( brawl.cd_slam > 0 )
change	brawl.cd_slam	-=	1
