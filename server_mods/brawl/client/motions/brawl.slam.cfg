cinderbox_motions	3
# Baked from the CbMotion nodes of the CbItem brawl.slam. Edit the item's scene and bake again.
motion	Slam
when	event	brawl.slam.used
if	( brawl.cd_slam <= 0 and not grounded )
duration	3
change	brawl.cd_slam	=	5
emit	brawl.slam.started
impulse	self	25	world	vertical	0	-1	0
step	0	0	grounded
emit	brawl.slam.landed
