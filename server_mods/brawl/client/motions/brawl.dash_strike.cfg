emit	brawl.dash_strike.started
motion	Hit
when	event	brawl.dash_strike.used
if	( brawl.cd_dash <= 0 )
duration	0.05
probe	4	0
hold_emit	brawl.dash_strike.hit
impulse	hit	10	move	none
