cinderbox_motions	3
# Baked from the CbMotion nodes of the CbItem brawl.fist. Edit the item's scene and bake again.
motion	Jab
when	event	brawl.fist.used
if	( not linked and brawl.combo < 2 )
until	( brawl.fist.used or pressed.jump )
cooldown	0.3
duration	0.05
change	brawl.combo	+=	1
change	brawl.combo_left	=	1
probe	2.8	0
hold_emit	brawl.jab.hit
impulse	hit	4	move	none
motion	Finisher
when	event	brawl.fist.used
if	( brawl.combo >= 2 )
cooldown	0.3
duration	0.05
change	brawl.combo	=	0
probe	2.8	0
hold_emit	brawl.finisher.hit
impulse	hit	14	move	none
impulse	hit	5	up	none
