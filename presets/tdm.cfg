# Team deathmatch: the slice (ROADMAP step 4). An arena brawler in two teams: the brawler's kit and
# the bat and the sword, rounds to a team's kill limit, teammates do not hurt or toss each other.
#   cb_server --preset tdm                      as it is
#   cb_server --preset tdm --map example_arena  anything after it wins
#   tools\playtest.ps1 -ServerPreset tdm
# The map: the slice's arena (a city block with a park, two towers, two garages; team spawns at the
# west and east streets' ends). Bots fill a game up to six players (one leaves as a person joins).

--map arena
--mods inventory,item,pickup,expire,chat,combat,brawl,melee,sword,deathmatch,teams,bots
--mod-option teams.count=2
--mod-option deathmatch.team_kills=25
--mod-option deathmatch.round_seconds=300
--mod-option bots.fill=6
