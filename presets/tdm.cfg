# Team deathmatch: the slice (ROADMAP step 4). An arena brawler in two teams: the brawler's kit and
# the bat, rounds to a team's kill limit, teammates do not hurt or toss each other.
#   cb_server --preset tdm                      as it is
#   cb_server --preset tdm --map example_arena  anything after it wins
#   tools\playtest.ps1 -ServerPreset tdm
# The map is test_ground until the slice's arena is made.

--map test_ground
--mods inventory,item,pickup,expire,chat,combat,brawl,melee,deathmatch,teams
--mod-option teams.count=2
--mod-option deathmatch.team_kills=25
--mod-option deathmatch.round_seconds=300
